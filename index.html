<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<title>宝可梦151 · 看图识别</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css">
<script src="./app.js" defer></script>
</head><body>
<div id="pk-mobile-preview">
 <section id="pk-mobile" aria-label="宝可梦151手机识别练习">
  <header class="m-header"><div><div class="m-kicker">POKÉDEX / KANTO</div><h2>宝可梦初代 151 答题</h2></div></header>
  <div class="m-progressline"><span id="pk-round">第 1 轮 · 随机训练</span><span id="pk-count">01 <small>/ 151</small></span></div>
  <div class="m-progress" role="progressbar" aria-label="本轮完成" aria-valuemin="0" aria-valuemax="151" aria-valuenow="0" id="pk-progress"><div id="pk-progress-fill"></div></div>
  <div id="pk-card">
   <div class="m-deck"><button id="pk-prev" class="m-stack m-stack-prev" type="button" aria-label="查看上一题" disabled hidden><span class="m-stack-edge">←</span><span class="m-sr-only">上一题</span></button><button id="pk-next" class="m-stack m-stack-next" type="button" aria-label="查看下一题" disabled hidden><span class="m-stack-edge">→</span><span class="m-sr-only" id="pk-next-label">下一题</span></button><div id="pk-stage">
    <span id="pk-status" hidden>待识别</span>
    <div class="m-art">
     <div class="m-orbit" aria-hidden="true"></div>
     <img id="pk-picture" alt="待识别的宝可梦图片" draggable="false" src="https://cdn.jsdelivr.net/gh/PokeAPI/sprites@master/sprites/pokemon/other/official-artwork/25.png">
     <span id="pk-loading" role="status">图片加载中…</span>
    </div>
    <div class="m-id" id="pk-mystery">?</div>
    <div id="pk-answer" hidden><h3 id="pk-answer-name"></h3><p id="pk-memory"></p></div>
   </div>
   </div>
   <div class="m-response">
    <form id="pk-form" autocomplete="off">
     <label for="pk-name">仔细观察，试着叫出它的名字。</label>
     <div class="m-inputwrap"><input id="pk-name" placeholder="宝可梦名称" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>
     <div id="pk-feedback" aria-live="polite"></div>
     <button type="submit" id="pk-check" class="m-primary">确认名称</button>
    </form>
    <button type="button" id="pk-reveal" class="m-reveal"><span id="pk-reveal-label">不会，揭晓答案</span></button>
   </div>
  </div>
  <footer class="m-footer">
   <div class="m-bottomline"><span id="pk-score">独立答对 0</span><span>图像：PokéAPI / Pokémon</span></div>
  </footer>
 </section>
</div>
</body></html>
